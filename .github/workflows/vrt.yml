name: visual-regression

on:
  pull_request:
    paths:
      - "assets/src/**"
      - "assets/playwright.config.ts"
      - "assets/package.json"
      - ".github/workflows/vrt.yml"
  workflow_dispatch:

jobs:
  vrt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: neo-src/go.sum

      - name: Install frontend deps
        working-directory: assets
        run: pnpm install

      - name: Install GTK4 and WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config \
            libgirepository1.0-dev

      - name: Generate Wails bindings
        run: bash scripts/generate-bindings.sh

      - name: Build Go backend
        working-directory: neo-src
        # test_keystore：VRT 验的是渲染，不是 keystore 正确性（后者由
        # ci.yml 的 keystore-integration job 用真 daemon 覆盖）。不注入的话，
        # runner 上没有 Secret Service，后端会在启动期 fail-fast 直接退出，
        # playwright 的 webServer 起不来 → 整个 job 挂在启动阶段、截图一条都没跑。
        # 漏掉这个 tag 会让「VRT 红」的真实原因完全被掩盖（本 PR 就发生过）。
        run: go build -tags test_keystore -o bin/server ./cmd/server

      - name: Ensure test_tmp exists for backend db path
        run: mkdir -p assets/test_tmp

      - name: Install Playwright browser
        working-directory: assets
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chinese fonts for VRT
        run: sudo apt-get install -y fonts-noto-cjk

      - name: Run visual regression tests
        working-directory: assets
        run: pnpm run test:vrt

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: assets/playwright-report
          if-no-files-found: ignore
