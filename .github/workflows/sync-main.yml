name: Sync develop into main

# 发布新版本(release published)后,将 develop 的最新进度 fast-forward
# 到 main。仅允许无冲突的 fast-forward;若 main 已领先/分叉则失败并提示
# 人工处理,绝不 force-push、绝不产生 merge commit。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-main
  cancel-in-progress: false

jobs:
  sync-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fast-forward main to develop
        run: |
          set -euo pipefail
          git fetch origin main develop

          # develop 已经是 main 的祖先 → main 不比 develop 慢,无需同步。
          if git merge-base --is-ancestor origin/develop main; then
            echo "origin/develop is already contained in main; nothing to do."
            exit 0
          fi

          # main 不是 develop 的祖先 → 无法 fast-forward,交给人工。
          if ! git merge-base --is-ancestor main origin/develop; then
            echo "::error::main has commits not present in develop; refusing to fast-forward. Resolve manually."
            exit 1
          fi

          git checkout main
          git merge --ff-only origin/develop
          git push origin main
