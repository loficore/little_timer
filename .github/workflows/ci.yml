name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write  # release job 需要写入 GitHub Release

jobs:
  # 前端检查：lint、build、类型检查、test
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: assets/pnpm-lock.yaml
      - run: pnpm install
        working-directory: assets
      - name: Install GTK4 and WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config \
            libgirepository1.0-dev
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: neo-src/go.sum
      - name: Generate Wails bindings
        run: bash scripts/generate-bindings.sh
      - run: pnpm run lint
        working-directory: assets
      - run: pnpm run validate:i18n
        working-directory: assets
      - run: pnpm run build
        working-directory: assets
      - run: pnpm run build:check
        working-directory: assets
      - run: pnpm run test
        working-directory: assets

  # 后端检查：tidy、build、test、vet
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: neo-src/go.sum
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsqlite3-dev \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev
      - run: go mod tidy
        working-directory: neo-src
      - run: go build -o bin/server ./cmd/server
        working-directory: neo-src
      - run: go test ./...
        working-directory: neo-src
      - run: go vet ./...
        working-directory: neo-src

    # 端到端测试：构建前后端后运行真实用户旅程
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: assets/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: neo-src/go.sum
      - run: pnpm install
        working-directory: assets
      - name: Install GTK4 and WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config \
            libgirepository1.0-dev
      - name: Generate Wails bindings
        run: bash scripts/generate-bindings.sh
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: assets
      - run: pnpm run build
        working-directory: assets
      - run: go build -o bin/server ./cmd/server
        working-directory: neo-src
      - name: Ensure test_tmp exists for backend db path
        run: mkdir -p assets/test_tmp
      - run: pnpm exec playwright test --project=mobile-390 --project=mobile-412 --project=desktop-1280 --reporter=line
        timeout-minutes: 20
        working-directory: assets
      - name: Force cleanup lingering webServer processes
        if: always()
        run: pkill -9 -f "bin/server\|vite" 2>/dev/null || true

    # 视觉回归测试：仅在代码验证事件中运行
  vrt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    concurrency:
      group: vrt-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: assets/pnpm-lock.yaml
      - run: pnpm install
        working-directory: assets
      - name: Install GTK4 and WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config \
            libgirepository1.0-dev
      - name: Generate Wails bindings
        run: bash scripts/generate-bindings.sh
      - name: Install Chinese fonts for VRT
        run: sudo apt-get install -y fonts-noto-cjk
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: assets
      - run: pnpm run test:vrt || true
        working-directory: assets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: assets/playwright-report
          if-no-files-found: ignore

  # 三平台 WebView 构建矩阵（取代原 android-build job）：
  #   - linux   : 桌面 WebView 二进制 —— webview_go 硬编码 pkg-config gtk+-3.0+webkit2gtk-4.0，
  #               但 ubuntu-latest(24.04) 只有 webkit2gtk-4.1：装 4.1 包 + pc shim 伪装成 4.0；
  #               wails3 bindings CLI 需 GTK4+WebKitGTK-6.0（两套都要装）
  #   - windows : 桌面 WebView 二进制 —— WebView2 无需 GTK；cgo 需 mingw gcc/g++
  #               （webview_go 的 CXXFLAGS/LDFLAGS 是 gcc 风格，MSVC 不可用）
  #   - android : APK —— scripts/build-android.sh 内部再跑 android bindings + NDK + Gradle
  # 修复点：wails3 bindings CLI 在 Linux 上编译时要求 GTK4+WebKitGTK-6.0 dev 包；
  # 原 android-build job 把 apt 安装放在 bindings 之后导致失败 —— 现移到 bindings 之前。
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            timeout: 20
            artifact: little-timer-linux
            artifact-path: neo-src/bin/server
          - name: windows
            os: windows-latest
            timeout: 25
            artifact: little-timer-windows
            artifact-path: neo-src/bin/server.exe
          - name: android
            os: ubuntu-latest
            timeout: 60
            artifact: LittleTimer-apk
            artifact-path: bin/LittleTimer.apk
    concurrency:
      group: build-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: neo-src/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: assets/pnpm-lock.yaml
      - name: Install Linux build dependencies (GTK3+webkit2gtk-4.1 for webview_go via 4.0 pc shim, GTK4+webkitgtk-6.0 for wails3 CLI)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config \
            libgirepository1.0-dev \
            libsqlite3-dev
      - name: Create webkit2gtk-4.0 pkg-config shim (24.04 ships 4.1 only)
        if: matrix.name == 'linux'
        run: |
          PC_DIR="/usr/lib/x86_64-linux-gnu/pkgconfig"
          sudo cp "$PC_DIR/webkit2gtk-4.1.pc" "$PC_DIR/webkit2gtk-4.0.pc"
          pkg-config --modversion webkit2gtk-4.0
      - name: Install Android build dependencies (GTK4+webkitgtk-6.0 for wails3 CLI, sqlite for cgo)
        if: matrix.name == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config \
            libgirepository1.0-dev \
            libsqlite3-dev
      - name: Install mingw (CGO toolchain for webview_go)
        if: matrix.name == 'windows'
        run: |
          choco install mingw -y
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $GITHUB_PATH
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\x86_64-w64-mingw32\bin" >> $GITHUB_PATH
          gcc --version
          g++ --version
      - run: pnpm install
        working-directory: assets
      - name: Generate Wails bindings
        if: matrix.name != 'android'
        run: bash scripts/generate-bindings.sh
      - run: pnpm run build
        if: matrix.name != 'android'
        working-directory: assets
      - name: Copy built frontend into Go embed path
        if: matrix.name != 'android'
        run: cp assets/dist/index.html neo-src/cmd/server/assets/index.html
      - name: Build desktop WebView server (linux)
        if: matrix.name == 'linux'
        run: go build -tags "webview,embed_ui" -o bin/server ./cmd/server
        working-directory: neo-src
      - name: Build desktop WebView server (windows)
        if: matrix.name == 'windows'
        run: go build -tags "webview,embed_ui" -o bin/server.exe ./cmd/server
        working-directory: neo-src
      - name: Setup JDK 17
        if: matrix.name == 'android'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Setup Android SDK
        if: matrix.name == 'android'
        uses: android-actions/setup-android@v4
      - name: Install Android NDK
        if: matrix.name == 'android'
        run: |
          sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          ls $ANDROID_HOME/ndk/
      - name: Build Android APK
        if: matrix.name == 'android'
        run: |
          chmod +x scripts/build-android.sh
          bash scripts/build-android.sh
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  # 发布：同一工作流内等待所有检查完成
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [frontend, backend, e2e, vrt]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # git-cliff（带缓存）
      - name: Setup git-cliff
        env:
          GIT_CLIFF_VERSION: v2.12.0
        run: |
          mkdir -p ~/.local/bin
          echo "${{ runner.os }}" | grep -q Linux && \
            ARCH="x86_64-unknown-linux-gnu" || \
            ARCH="x86_64-apple-darwin"
          CACHE_KEY="git-cliff-${{ runner.os }}-${{ env.GIT_CLIFF_VERSION }}"
          if [ -f "$HOME/.cache/$CACHE_KEY/git-cliff" ]; then
            cp "$HOME/.cache/$CACHE_KEY/git-cliff" ~/.local/bin/git-cliff
            chmod +x ~/.local/bin/git-cliff
          else
            URL="https://github.com/orhun/git-cliff/releases/download/${{ env.GIT_CLIFF_VERSION }}/git-cliff-${GIT_CLIFF_VERSION#v}-$ARCH.tar.gz"
            wget -qO - "$URL" | tar -xz -C ~/.local/bin
            mkdir -p "$HOME/.cache/$CACHE_KEY"
            cp ~/.local/bin/git-cliff "$HOME/.cache/$CACHE_KEY/"
          fi
          git-cliff --version

      - name: Generate release changelog
        run: >-
          git-cliff --config cliff.toml --latest --strip header
          > release_notes.md

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: assets/pnpm-lock.yaml

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          ls $ANDROID_HOME/ndk/

      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config \
            libgirepository1.0-dev \
            libsqlite3-dev

      - name: Make scripts executable
        run: chmod +x scripts/*.sh || true

      - name: Run packaging script
        env:
          VERSION: ${{ github.event.release.tag_name || github.ref }}
        run: |
          VERSION="${VERSION#refs/tags/}"
          VERSION="${VERSION#v}"
          ./scripts/package_go.sh --version "$VERSION"

      - name: Build Android APK
        run: |
          chmod +x scripts/build-android.sh
          bash scripts/build-android.sh
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Copy APK to dist
        run: mkdir -p dist && cp bin/LittleTimer.apk dist/

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.release.tag_name || github.ref }}
          name: ${{ github.event.release.name || github.ref }}
          bodyFile: release_notes.md
          artifacts: dist/*.tar.gz bin/LittleTimer.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          replacesArtifacts: true
          allowUpdates: true
