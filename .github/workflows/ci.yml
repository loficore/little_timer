name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 前端检查：lint、build、类型检查、test
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: assets/pnpm-lock.yaml
      - run: pnpm install
        working-directory: assets
      - name: Install GTK4 and WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config \
            libgirepository1.0-dev
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: neo-src/go.sum
      - name: Generate Wails bindings
        run: bash scripts/generate-bindings.sh
      - run: pnpm run lint
        working-directory: assets
      - run: pnpm run validate:i18n
        working-directory: assets
      - run: pnpm run build
        working-directory: assets
      - run: pnpm run build:check
        working-directory: assets
      - run: pnpm run test
        working-directory: assets

  # 后端检查：tidy、build、test、vet
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: neo-src/go.sum
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsqlite3-dev \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev
      - run: go mod tidy
        working-directory: neo-src
      - run: go build -o bin/server ./cmd/server
        working-directory: neo-src
      - run: go test ./...
        working-directory: neo-src
      - run: go vet ./...
        working-directory: neo-src

    # 端到端测试：构建前后端后运行真实用户旅程
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: assets/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: neo-src/go.sum
      - run: pnpm install
        working-directory: assets
      - name: Install GTK4 and WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config \
            libgirepository1.0-dev
      - name: Generate Wails bindings
        run: bash scripts/generate-bindings.sh
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: assets
      - run: pnpm run build
        working-directory: assets
      # test_keystore：e2e 验的是应用行为而非 keystore 正确性（后者由
      # keystore-integration job 用真 daemon 覆盖）。该 build tag 让
      # keystore.Current() 返回内存实现，编译期门禁，生产构建不含。
      - run: go build -tags test_keystore -o bin/server ./cmd/server
        working-directory: neo-src
      - name: Ensure test_tmp exists for backend db path
        run: mkdir -p assets/test_tmp
      - run: pnpm exec playwright test --project=mobile-390 --project=mobile-412 --project=desktop-1280 --reporter=line
        timeout-minutes: 20
        working-directory: assets
      - name: Force cleanup lingering webServer processes
        if: always()
        run: pkill -9 -f "bin/server\|vite" 2>/dev/null || true

    # 视觉回归测试：仅在代码验证事件中运行
  # keystore 集成测试：起一个真实的 Secret Service daemon，让
  # internal/keystore 的 dbus 集成测试真正跑协议往返。
  #
  # 破坏性：该测试会创建/删除 keyring 里的 item，故带 integration_dbus tag，
  # 默认构建不跑。无 daemon 环境下该 tag 的用例自行 skip。
  keystore-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: neo-src/go.sum
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            gnome-keyring \
            dbus-x11 \
            libsecret-1-dev \
            libdbus-1-dev \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libsqlite3-dev
      # gnome-keyring 的两段式初始化。**不要**改成 --daemonize：
      #   1) `--unlock` 用管道里的口令物化 login 集合（daemon 尚不存在）；
      #   2) `--start --components=secrets` 才 fork 出 daemon。
      # 两段的 stdout 都是 shell export 语句（GNOME_KEYRING_* socket 路径），
      # **必须 eval**，丢掉它们则 Secret Service 虽在 bus 上却无人能连 ——
      # 症状是 "collection/login does not exist" 或集合始终 Locked=true。
      # 整个 job 的测试都跑在这一个 dbus 会话里，故 bus 不会中途消失。
      - name: 启动内存 keyring（仅本 job 生命周期）
        run: |
          dbus-run-session -- bash -c '
            KEYRING_PW=lt-ci-keyring
            eval "$(printf "%s\n" "$KEYRING_PW" | gnome-keyring-daemon --unlock)"
            eval "$(printf "%s\n" "$KEYRING_PW" | gnome-keyring-daemon --start --components=secrets)"
            # 打开 daemon 重启持久性测试的两道破坏性门：
            #   LT_IT_KEYRING_PASSWORD   —— 与上面 KEYRING_PW 必须一致，测试要用它
            #                                 把 pkill 掉的 daemon 原样拉回来；
            #   LT_IT_DESTROY_MASTER_KEY—— 前置清理会删既有 master key。
            # 在 CI 上开这两道门是安全的：runner 是一次性的，这个 keyring 由本
            # job 上面的配方刚刚创建，不存在任何值得保护的既有凭据。
            # 门本身保留 —— 它防的是「开发者在本机跑集成测试时误杀真实 keyring」，
            # 那个场景与 CI 无关，所以门必须留着、由 CI 显式开。
            export LT_IT_KEYRING_PASSWORD="$KEYRING_PW"
            export LT_IT_DESTROY_MASTER_KEY=1
            # -v 是必需的：这些测试在 daemon 不可用时会 t.Skip 而非失败，
            # 不带 -v 的话「全跳过」和「全跑过」在 CI 输出里长得一模一样
            # （都只打印一行 ok）。绿得有没有意义必须一眼可辨。
            go test -v -tags "linux integration_dbus" ./internal/keystore/
          '
        working-directory: neo-src
      - run: go mod tidy
        working-directory: neo-src
      - run: go build -o bin/server ./cmd/server
        working-directory: neo-src

  # windows-dpapi 后端正式回归（spike 已完成使命并删除）：纯 windows tag
  # 跑常量/no-op/往返/篡改负例；integration_dpapi tag 追加错 entropy 直接
  # syscall 负例（review focus #2/#3）。真实断言只在 GitHub-hosted
  # windows-latest 上跑，Linux 侧仅交叉编译 vet。job 名 test-windows 供
  # 后续任务扩展步骤。
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25.0", cache-dependency-path: neo-src/go.sum }
      - name: Windows keystore tests
        working-directory: neo-src
        run: go test -v -tags windows ./internal/keystore/
      - name: DPAPI integration negative tests
        working-directory: neo-src
        run: go test -v -tags "windows integration_dpapi" ./internal/keystore/

  vrt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    concurrency:
      group: vrt-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: assets/pnpm-lock.yaml
      - run: pnpm install
        working-directory: assets
      - name: Install GTK4 and WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config \
            libgirepository1.0-dev
      - name: Generate Wails bindings
        run: bash scripts/generate-bindings.sh
      - name: Install Chinese fonts for VRT
        run: sudo apt-get install -y fonts-noto-cjk
      # 与 e2e 同理：VRT 验的是渲染，不是 keystore 正确性。注入内存 keystore，
      # 避免把 D-Bus / gnome-keyring 的脆弱性带进视觉回归。
      - run: go build -tags test_keystore -o bin/server ./cmd/server
        working-directory: neo-src
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: assets
      - run: pnpm run test:vrt || true
        working-directory: assets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: assets/playwright-report
          if-no-files-found: ignore

  # 三平台 WebView 构建矩阵（取代原 android-build job）：
  #   - linux   : 桌面 WebView 二进制 —— webview_go 硬编码 pkg-config gtk+-3.0+webkit2gtk-4.0，
  #               但 ubuntu-latest(24.04) 只有 webkit2gtk-4.1：装 4.1 包 + pc shim 伪装成 4.0；
  #               wails3 bindings CLI 需 GTK4+WebKitGTK-6.0（两套都要装）
  #   - windows : 桌面 WebView 二进制 —— WebView2 无需 GTK；cgo 需 mingw gcc/g++
  #               （webview_go 的 CXXFLAGS/LDFLAGS 是 gcc 风格，MSVC 不可用）
  #   - android : APK —— scripts/build-android.sh 内部再跑 android bindings + NDK + Gradle
  # 修复点：wails3 bindings CLI 在 Linux 上编译时要求 GTK4+WebKitGTK-6.0 dev 包；
  # 原 android-build job 把 apt 安装放在 bindings 之后导致失败 —— 现移到 bindings 之前。
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            timeout: 20
            artifact: little-timer-linux
            artifact-path: neo-src/bin/server
          - name: windows
            os: windows-latest
            timeout: 25
            artifact: little-timer-windows
            artifact-path: neo-src/bin/server.exe
          - name: android
            os: ubuntu-latest
            timeout: 60
            artifact: LittleTimer-apk
            artifact-path: bin/LittleTimer.apk
    concurrency:
      group: build-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: neo-src/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: assets/pnpm-lock.yaml
      - name: Install Linux build dependencies (GTK3+webkit2gtk-4.1 for webview_go via 4.0 pc shim, GTK4+webkitgtk-6.0 for wails3 CLI)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config \
            libgirepository1.0-dev \
            libsqlite3-dev
      - name: Create webkit2gtk-4.0 pkg-config shim (24.04 ships 4.1 only)
        if: matrix.name == 'linux'
        run: |
          PC_DIR="/usr/lib/x86_64-linux-gnu/pkgconfig"
          sudo cp "$PC_DIR/webkit2gtk-4.1.pc" "$PC_DIR/webkit2gtk-4.0.pc"
          pkg-config --modversion webkit2gtk-4.0
      - name: Install Android build dependencies (GTK4+webkitgtk-6.0 for wails3 CLI, sqlite for cgo)
        if: matrix.name == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config \
            libgirepository1.0-dev \
            libsqlite3-dev
      - name: Install mingw (CGO toolchain for webview_go)
        if: matrix.name == 'windows'
        run: |
          choco install mingw -y
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $GITHUB_PATH
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\x86_64-w64-mingw32\bin" >> $GITHUB_PATH
          gcc --version
          g++ --version
      - run: pnpm install
        working-directory: assets
      - name: Generate Wails bindings
        if: matrix.name != 'android'
        run: bash scripts/generate-bindings.sh
      - run: pnpm run build
        if: matrix.name != 'android'
        working-directory: assets
      - name: Copy built frontend into Go embed path
        if: matrix.name != 'android'
        run: cp assets/dist/index.html neo-src/cmd/server/assets/index.html
      - name: Build desktop WebView server (linux)
        if: matrix.name == 'linux'
        run: go build -tags "webview,embed_ui" -o bin/server ./cmd/server
        working-directory: neo-src
      - name: Build desktop WebView server (windows)
        if: matrix.name == 'windows'
        run: go build -tags "webview,embed_ui" -o bin/server.exe ./cmd/server
        working-directory: neo-src
      - name: Setup JDK 17
        if: matrix.name == 'android'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Setup Android SDK
        if: matrix.name == 'android'
        uses: android-actions/setup-android@v4
      - name: Install Android NDK
        if: matrix.name == 'android'
        run: |
          sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          ls $ANDROID_HOME/ndk/
      - name: Build Android APK
        if: matrix.name == 'android'
        run: |
          chmod +x scripts/build-android.sh
          bash scripts/build-android.sh
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

