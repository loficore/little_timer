name: Release CI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to use when manually running the workflow'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

# 四个 job：三个平台各自打包，publish 是 Release 页产物的唯一 writer
# （ncipollo/release-action 的 replacesArtifacts=true 会先清空该 tag 上的产物，
#  双 writer 必然互相清空 —— 所以只有一个 job 碰 Release）。
jobs:
  linux-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: neo-src/go.sum

      - name: Setup Node.js (frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: assets/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Make scripts executable
        run: chmod +x scripts/*.sh || true

      - name: Install system dependencies (SQLite + Wails GTK deps)
        # SQLite 给 go-sqlite3 cgo；libgtk-4-dev/libwebkitgtk-6.0-dev 给
        # scripts/generate-bindings.sh —— 虽然用 -tags=bindings，
        # wails/v3/internal/operatingsystem 仍会拉 gtk4/webkitgtk-6.0
        # pkg-config check，缺失即编译失败（与 ci.yml:46-53 对齐）。
        # rpm/deb 本身由容器构建（见 docs/linux-packaging.md）。
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsqlite3-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libgirepository1.0-dev \
            pkg-config

      - name: Generate Wails bindings
        # 前端通过 wailsApiClient.ts 引入 assets/src/bindings/ 下的生成产物，
        # 该目录在 .gitignore 中，需在 build 前由 wails3 生成。
        run: bash scripts/generate-bindings.sh

      - name: Compute version
        run: |
          set -eux
          RELEASE_TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          VERSION="${RELEASE_TAG#v}"
          if [ -z "$VERSION" ]; then
            VERSION="$(git describe --tags --exact-match 2>/dev/null || true)"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(git rev-parse --short HEAD)"
          fi
          VERSION="${VERSION#v}"
          echo "Using VERSION=$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package Linux artifacts
        run: |
          set -eux
          rm -rf dist
          just package "$VERSION"
          just package-linux "$VERSION"

      - name: Check artifact names
        run: bash scripts/check-artifact-names.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb
          if-no-files-found: error

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: neo-src/go.sum

      - name: Setup Node.js (frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: assets/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install mingw (CGO toolchain) and NSIS
        # webview_go 的 cgo flags 是 gcc 风格，MSVC 不可用。
        run: |
          choco install mingw nsis -y
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $GITHUB_PATH
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\x86_64-w64-mingw32\bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          makensis /VERSION
          gcc --version
          g++ --version

      - name: Generate Wails bindings
        # 必须早于前端构建：前端 import assets/src/bindings/。
        run: bash scripts/generate-bindings.sh

      - name: Compute version
        run: |
          set -eux
          RELEASE_TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          VERSION="${RELEASE_TAG#v}"
          if [ -z "$VERSION" ]; then
            VERSION="$(git describe --tags --exact-match 2>/dev/null || true)"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(git rev-parse --short HEAD)"
          fi
          VERSION="${VERSION#v}"
          echo "Using VERSION=$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package Windows artifacts
        # scripts/package-windows.sh 自足：前端 build、Go build、makensis、zip 全在里面
        run: |
          set -eux
          rm -rf dist
          bash scripts/package-windows.sh "$VERSION"

      - name: Check artifact names
        run: bash scripts/check-artifact-names.sh "$VERSION"

      - name: Smoke test installer
        # 静默安装 → version → 静默卸载 → 安装目录消失且 %AppData%\LittleTimer 仍在
        run: bash scripts/smoke-windows-installer.sh "dist/little-timer-$VERSION-windows-x86_64-setup.exe" "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: neo-src/go.sum

      - name: Setup Node.js (frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: assets/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config \
            libgirepository1.0-dev \
            libsqlite3-dev

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Compute version
        run: |
          set -eux
          RELEASE_TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          VERSION="${RELEASE_TAG#v}"
          if [ -z "$VERSION" ]; then
            VERSION="$(git describe --tags --exact-match 2>/dev/null || true)"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(git rev-parse --short HEAD)"
          fi
          VERSION="${VERSION#v}"
          echo "Using VERSION=$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build APK
        # scripts/build-android.sh 内部自己跑 android bindings + NDK + Gradle
        run: |
          set -eux
          rm -rf dist
          bash scripts/build-android.sh
          mkdir -p dist
          cp bin/LittleTimer.apk "dist/little-timer-$VERSION-android-universal-debug.apk"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Check artifact names
        run: bash scripts/check-artifact-names.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*.apk
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [linux-packages, windows-installer, android-apk]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        env:
          GIT_CLIFF_VERSION: v2.12.0
        run: |
          set -eux
          VERSION="${GIT_CLIFF_VERSION#v}"
          ARCH="x86_64-unknown-linux-gnu"
          URL="https://github.com/orhun/git-cliff/releases/download/${GIT_CLIFF_VERSION}/git-cliff-${VERSION}-${ARCH}.tar.gz"
          TMPDIR=$(mktemp -d)
          wget -qO - "$URL" | tar -xz -C "$TMPDIR"
          BIN=$(find "$TMPDIR" -type f -name git-cliff | head -n 1 || true)
          if [ -z "$BIN" ]; then
            echo "git-cliff binary not found in archive" >&2
            ls -R "$TMPDIR" >&2 || true
            exit 1
          fi
          sudo mv "$BIN" /usr/bin/git-cliff
          sudo chmod +x /usr/bin/git-cliff
          rm -rf "$TMPDIR"
          /usr/bin/git-cliff --version

      - name: Generate release changelog
        run: |
          git-cliff --config cliff-release.toml --latest --strip header > release_notes.md

      - name: Collect build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release and attach artifacts
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          name: ${{ github.event.release.name || github.event.inputs.tag }}
          bodyFile: release_notes.md
          artifacts: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb
            dist/*.exe
            dist/*.zip
            dist/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          replacesArtifacts: true
          allowUpdates: true
