name: visual-regression

on:
  pull_request:
    paths:
      - "assets/src/**"
      - "assets/playwright.config.ts"
      - "assets/package.json"
      - ".github/workflows/vrt.yml"
  workflow_dispatch:

jobs:
  vrt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: neo-src/go.sum

      - name: Install frontend deps
        working-directory: assets
        run: pnpm install

      - name: Install GTK4 and WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config \
            libgirepository1.0-dev

      - name: Generate Wails bindings
        run: bash scripts/generate-bindings.sh

      - name: Build Go backend
        working-directory: neo-src
        run: go build -o bin/server ./cmd/server

      - name: Ensure test_tmp exists for backend db path
        run: mkdir -p assets/test_tmp

      - name: Install Playwright browser
        working-directory: assets
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chinese fonts for VRT
        run: sudo apt-get install -y fonts-noto-cjk

      - name: Run visual regression tests (UPDATE-SNAPSHOTS one-shot)
        working-directory: assets
        run: pnpm run test:vrt:update

      - name: Upload updated snapshots (one-shot, for follow-up PR to commit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-snapshots-updated
          path: assets/src/test/visual/specs/timer.spec.ts-snapshots/*.png
          if-no-files-found: warn

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: assets/playwright-report
          if-no-files-found: ignore
