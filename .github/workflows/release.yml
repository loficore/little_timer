name: Release CI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to use when manually running the workflow'
        required: false
        default: 'v2.0.0'

# 三个构建 job 只需要读仓库；只有 publish 要写 Release（见该 job 的 permissions）。
permissions:
  contents: read

# 四个 job：三个平台各自打包，publish 是 Release 页产物的唯一 writer。
# 单一 writer 的理由是幂等：publish 会先清掉该 tag 上的旧产物再上传，
# 这样「改名后新旧两套文件名同时挂在 Release 页上」不会发生。
# 注意两个 action 输入的分工：
#   - removeArtifacts: true  → 删掉该 release 上的**全部**旧产物（含旧命名的那些）
#   - replacesArtifacts: true → 只删与本次上传**同名**的产物（重跑时覆盖同名文件）
# 两个都开：前者保证产物集合干净，后者保证同名文件不重复。
jobs:
  linux-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        # 必须在 setup-node 之前：setup-node 的 cache=pnpm 会去找 pnpm 可执行文件
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js (frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: assets/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: neo-src/go.sum

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Make scripts executable
        run: chmod +x scripts/*.sh || true

      - name: Install system dependencies (SQLite + Wails GTK deps)
        # SQLite 给 go-sqlite3 cgo；libgtk-4-dev/libwebkitgtk-6.0-dev 给
        # scripts/generate-bindings.sh —— 虽然用 -tags=bindings，
        # wails/v3/internal/operatingsystem 仍会拉 gtk4/webkitgtk-6.0
        # pkg-config check，缺失即编译失败（与 ci.yml:46-53 对齐）。
        # rpm/deb 本身由容器构建（见 docs/linux-packaging.md）。
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsqlite3-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libgirepository1.0-dev \
            pkg-config

      - name: Generate Wails bindings
        # 前端通过 wailsApiClient.ts 引入 assets/src/bindings/ 下的生成产物，
        # 该目录在 .gitignore 中，需在 build 前由 wails3 生成。
        run: bash scripts/generate-bindings.sh

      - name: Compute version
        # 四个 job 共用 scripts/ci-version.sh：版本算错一处，Release 页上
        # 就会出现一半带 tag 版本、一半带 commit hash 的产物。
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: bash scripts/ci-version.sh

      - name: Package Linux artifacts
        run: |
          set -eux
          rm -rf dist
          just package "$VERSION"
          just package-linux "$VERSION"

      - name: Check artifact names
        run: bash scripts/check-artifact-names.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb
          if-no-files-found: error

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 版本号回退里用到 git describe --tags，浅克隆里永远失败
          fetch-depth: 0

      - name: Setup pnpm
        # 必须在 setup-node 之前：setup-node 的 cache=pnpm 会去找 pnpm 可执行文件
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js (frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: assets/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: neo-src/go.sum

      - name: Install mingw (CGO toolchain) and NSIS
        # webview_go 的 cgo flags 是 gcc 风格，MSVC 不可用。
        run: |
          choco install mingw nsis -y
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $GITHUB_PATH
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\x86_64-w64-mingw32\bin" >> $GITHUB_PATH
          # choco 的 nsis 包**不生成 makensis 的 shim**，安装目录不在 PATH 上 ——
          # 必须显式加进去，否则下一步会报 "makensis: command not found"。
          # 用 test 而不是 ls：ls 对缺失路径返回 2，在 -e -o pipefail 下会直接中止本步。
          nsis_dir=""
          for d in "/c/Program Files (x86)/NSIS" "/c/Program Files/NSIS"; do
            if [ -f "$d/makensis.exe" ]; then nsis_dir="$d"; break; fi
          done
          if [ -z "$nsis_dir" ]; then
            echo "cannot locate makensis.exe under the NSIS install dir" >&2
            exit 1
          fi
          cygpath -w "$nsis_dir" >> "$GITHUB_PATH"
          "$nsis_dir/makensis.exe" -VERSION

      - name: Verify toolchain
        run: |
          makensis -VERSION
          gcc --version
          g++ --version

      - name: Generate Wails bindings
        # 必须早于前端构建：前端 import assets/src/bindings/。
        run: bash scripts/generate-bindings.sh

      - name: Compute version
        # 四个 job 共用 scripts/ci-version.sh：版本算错一处，Release 页上
        # 就会出现一半带 tag 版本、一半带 commit hash 的产物。
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: bash scripts/ci-version.sh

      - name: Package Windows artifacts
        # scripts/package-windows.sh 自足：前端 build、Go build、makensis、zip 全在里面
        run: |
          set -eux
          rm -rf dist
          bash scripts/package-windows.sh "$VERSION"

      - name: Check artifact names
        run: bash scripts/check-artifact-names.sh "$VERSION"

      - name: Smoke test installer
        # 静默安装 → version → 静默卸载 → 安装目录消失且 %AppData%\LittleTimer 仍在
        run: bash scripts/smoke-windows-installer.sh "dist/little-timer-$VERSION-windows-x86_64-setup.exe" "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 版本号回退里用到 git describe --tags，浅克隆里永远失败
          fetch-depth: 0

      - name: Setup pnpm
        # 必须在 setup-node 之前：setup-node 的 cache=pnpm 会去找 pnpm 可执行文件
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js (frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: assets/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: neo-src/go.sum

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config \
            libgirepository1.0-dev \
            libsqlite3-dev

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Compute version
        # 四个 job 共用 scripts/ci-version.sh：版本算错一处，Release 页上
        # 就会出现一半带 tag 版本、一半带 commit hash 的产物。
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: bash scripts/ci-version.sh

      - name: Build APK
        # scripts/build-android.sh 内部自己跑 android bindings + NDK + Gradle
        run: |
          set -eux
          rm -rf dist
          bash scripts/build-android.sh
          mkdir -p dist
          cp bin/LittleTimer.apk "dist/little-timer-$VERSION-android-universal-debug.apk"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Check artifact names
        run: bash scripts/check-artifact-names.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*.apk
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [linux-packages, windows-installer, android-apk]
    # 只有这个 job 需要写 Release；其余 job 只需要读（见文件顶部 permissions）
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        # 四个 job 共用 scripts/ci-version.sh：版本算错一处，Release 页上
        # 就会出现一半带 tag 版本、一半带 commit hash 的产物。
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: bash scripts/ci-version.sh

      - name: Install git-cliff
        env:
          GIT_CLIFF_VERSION: v2.12.0
        run: |
          set -eux
          VERSION="${GIT_CLIFF_VERSION#v}"
          ARCH="x86_64-unknown-linux-gnu"
          URL="https://github.com/orhun/git-cliff/releases/download/${GIT_CLIFF_VERSION}/git-cliff-${VERSION}-${ARCH}.tar.gz"
          TMPDIR=$(mktemp -d)
          wget -qO - "$URL" | tar -xz -C "$TMPDIR"
          BIN=$(find "$TMPDIR" -type f -name git-cliff | head -n 1 || true)
          if [ -z "$BIN" ]; then
            echo "git-cliff binary not found in archive" >&2
            ls -R "$TMPDIR" >&2 || true
            exit 1
          fi
          sudo mv "$BIN" /usr/bin/git-cliff
          sudo chmod +x /usr/bin/git-cliff
          rm -rf "$TMPDIR"
          /usr/bin/git-cliff --version

      - name: Generate release changelog
        run: |
          git-cliff --config cliff-release.toml --latest --strip header > release_notes.md

      - name: Collect build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Check artifact names
        # 发布前的最后一道门禁：三个构建 job 各自验过自己的产物，
        # 但汇到一起的 dist/ 没人验过 —— 版本不一致、多余文件都在这里被拦下。
        run: bash scripts/check-artifact-names.sh "$VERSION"

      - name: Create GitHub Release and attach artifacts
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          name: ${{ github.event.release.name || github.event.inputs.tag }}
          bodyFile: release_notes.md
          artifacts: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb
            dist/*.exe
            dist/*.zip
            dist/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          # 两个输入的分工：
          #   removeArtifacts   删掉该 release 上**全部**旧产物（含改名前的旧文件名）
          #   replacesArtifacts 只删与本次上传同名的产物（重跑时覆盖同名文件）
          # 只开后者会让旧命名的产物留在页面上 —— 改名后的 release 会同时挂新旧两套。
          removeArtifacts: true
          replacesArtifacts: true
          allowUpdates: true
